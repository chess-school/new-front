name: Build and Deploy to Vercel Mirror

on:
  push:
    # Запускать только при пуше в вашу главную ветку (замените 'main', если нужно)
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем исходный код
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Настраиваем Node.js (укажите свою версию)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Опционально: кэшируем зависимости для ускорения
          cache: 'npm'

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: npm ci # 'npm ci' быстрее и надежнее для CI/CD чем 'npm install'

      # 4. Собираем проект
      - name: Build project
        run: npm run build # Убедитесь, что команда сборки в package.json называется 'build'

      # 5. Деплоим результат сборки в репозиторий-зеркало
      - name: Deploy to mirror repository
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Ваш PAT, который мы уже добавили в секреты
          personal_token: ${{ secrets.PAT_FOR_MIRROR }}

          # Репозиторий, куда нужно опубликовать билд
          external_repository: NikitaSemenukha/mirror-front

          # Ветка в репозитории-зеркале, куда будут попадать файлы
          publish_branch: main

          # Папка с результатом сборки.
          # !!! ИЗМЕНИТЕ './dist' на вашу папку, если она называется иначе (например, './build' или './out')
          publish_dir: ./dist
