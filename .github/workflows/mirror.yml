name: Mirror to Personal Repo

on:
  push:
    branches:
      - dev

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to mirror repo
        run: |
          git push --mirror https://${{ secrets.PAT_FOR_MIRROR }}@github.com/NikitaSemenukha/mirror-front.git
