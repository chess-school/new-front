name: Mirror to Personal Repo

on:
  push:
    branches:
      - main # Или ваша основная ветка

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          # Логин вашего личного аккаунта и имя репозитория-приемника
          target_repo_url: github.com/NikitaSemenukha/mirror-front.git

          # Имя секрета, в котором хранится ваш PAT
          pat: ${{ secrets.PAT_FOR_MIRROR }}
